<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geoportal - Espacios Verdes Públicos (Lanús)</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    /* Estilos del contenedor según guía (Viewport Height & Width) */
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: Arial, sans-serif; }
    #map { height: 100vh; width: 100vw; }
    
    /* Panel de Título / Encabezado */
    .info-panel {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1000;
      background: white;
      padding: 12px 16px;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      max-width: 280px;
    }
    .info-panel h2 { margin: 0 0 4px 0; font-size: 15px; color: #2c3e50; }
    .info-panel p { margin: 0; font-size: 11px; color: #555; }

    /* Estilos para Leyenda Cartográfica Dinámica */
    .info.legend {
      background: white;
      padding: 12px;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      font-size: 12px;
      line-height: 20px;
      color: #333;
    }
    .info.legend h4 { margin: 0 0 8px 0; font-size: 13px; color: #2c3e50; }
    .legend-item { display: flex; align-items: center; margin-bottom: 4px; }
    .legend-color { width: 16px; height: 16px; margin-right: 8px; border-radius: 3px; display: inline-block; opacity: 0.8; }
    .circle-marker { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 8px; border: 2px solid white; }
  </style>
</head>
<body>

  <div class="info-panel">
    <h2>Geoportal Lanús</h2>
    <p>Espacios Verdes y Cobertura Peatonal</p>
  </div>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Parte 3: Inicialización de Mapa
    const map = L.map('map').setView([-34.707, -58.397], 13);

    // Mapa base OpenStreetMap
    const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // Control de capas desplegado (collapsed: false)
    const overlayMaps = {};
    const controlCapas = L.control.layers({ "OpenStreetMap": osm }, overlayMaps, { collapsed: false }).addTo(map);

    // Renderizadores independientes para jerarquía visual (Z-Index)
    const rendererPoligonos = L.svg({ padding: 0.5 });
    const rendererPuntos = L.svg({ padding: 0.5 });

    // Parte 4: Carga Asíncrona con Promise.all
    Promise.all([
      fetch('Dpto_Lanus.geojson').then(res => res.json()),
      fetch('Cobertura_EV.geojson').then(res => res.json()),
      fetch('Cobertura_SP.geojson').then(res => res.json()),
      fetch('Espacios_verdes.geojson').then(res => res.json()),
      fetch('Sitios_potenciales.geojson').then(res => res.json())
    ]).then(([dataLanus, dataCoberturaEV, dataCoberturaSP, dataEV, dataSP]) => {

      // 1. Límite de Lanús
      const layerLanus = L.geoJSON(dataLanus, {
        renderer: rendererPoligonos,
        style: { color: '#2c3e50', weight: 2, fillOpacity: 0, dashArray: '4' }
      }).addTo(map);

      // 2. Cobertura Actual EV
      const layerCoberturaEV = L.geoJSON(dataCoberturaEV, {
        renderer: rendererPoligonos,
        style: { color: '#27ae60', weight: 1, fillColor: '#2ecc71', fillOpacity: 0.35 }
      }).addTo(map);

      // 3. Cobertura Nueva Propuesta (Sitios Potenciales)
      const layerCoberturaSP = L.geoJSON(dataCoberturaSP, {
        renderer: rendererPoligonos,
        style: { color: '#8e44ad', weight: 1, fillColor: '#9b59b6', fillOpacity: 0.35 }
      });

      // 4. Espacios Verdes Actuales (con eventos mouseover/mouseout)
      const layerEV = L.geoJSON(dataEV, {
        renderer: rendererPoligonos,
        style: { color: '#1e8449', weight: 1, fillColor: '#27ae60', fillOpacity: 0.8 },
        onEachFeature: function (feature, layer) {
          // Eventos de selección interactiva
          layer.on({
            mouseover: e => {
              const l = e.target;
              l.setStyle({ weight: 3, color: '#f39c12', fillOpacity: 0.9 });
              l.bringToFront();
            },
            mouseout: e => {
              layerEV.resetStyle(e.target);
            }
          });
          
          if (feature.properties && feature.properties.name) {
            layer.bindPopup(`<b>Espacio Verde:</b> ${feature.properties.name}`);
          } else {
            layer.bindPopup(`<b>Espacio Verde Público</b>`);
          }
        }
      }).addTo(map);

      // 5. Sitios Potenciales (Puntos Candidatos)
      const layerSP = L.geoJSON(dataSP, {
        renderer: rendererPuntos,
        pointToLayer: function (feature, latlng) {
          return L.circleMarker(latlng, {
            radius: 8,
            fillColor: "#e74c3c",
            color: "#ffffff",
            weight: 2,
            opacity: 1,
            fillOpacity: 0.9
          });
        },
        onEachFeature: function (feature, layer) {
          layer.bindPopup("<b>Sitio Candidato Propuesto</b><br>Ubicación prioritaria para nuevo EV.");
        }
      }).addTo(map);

      // Agregar capas al control
      controlCapas.addOverlay(layerLanus, "Límite Lanús");
      controlCapas.addOverlay(layerCoberturaEV, "Cobertura actual (10 min)");
      controlCapas.addOverlay(layerCoberturaSP, "Nueva cobertura propuesta");
      controlCapas.addOverlay(layerEV, "Plazas y Parques Actuales");
      controlCapas.addOverlay(layerSP, "Sitios Candidatos Propuestos");

      // Parte 6: Construcción de Leyenda Cartográfica Dinámica
      const legend = L.control({ position: 'bottomleft' });
      legend.onAdd = function () {
        const div = L.DomUtil.create('div', 'info legend');
        div.innerHTML = '<h4>Referencias</h4>';
        
        const elementos = [
          { nombre: 'Plazas y Parques Actuales', color: '#27ae60', tipo: 'cuadro' },
          { nombre: 'Cobertura Actual (10 min)', color: '#2ecc71', tipo: 'cuadro' },
          { nombre: 'Nueva Cobertura Propuesta', color: '#9b59b6', tipo: 'cuadro' },
          { nombre: 'Sitio Candidato Propuesto', color: '#e74c3c', tipo: 'circulo' }
        ];

        elementos.forEach(item => {
          if (item.tipo === 'circulo') {
            div.innerHTML += `<div class="legend-item"><span class="circle-marker" style="background:${item.color};"></span><span>${item.nombre}</span></div>`;
          } else {
            div.innerHTML += `<div class="legend-item"><span class="legend-color" style="background:${item.color};"></span><span>${item.nombre}</span></div>`;
          }
        });

        return div;
      };
      legend.addTo(map);

    }).catch(err => console.error("Error al cargar las capas GeoJSON:", err));
  </script>
</body>
</html>
